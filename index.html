<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola mundo</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #1f2937;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
        }

        main {
            width: min(100%, 600px);
            padding: 48px 32px;
            text-align: center;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgb(31 41 55 / 12%);
        }

        h1 {
            margin: 0;
            color: #4338ca;
            font-size: clamp(2rem, 6vw, 3rem);
            line-height: 1.2;
        }
    </style>
</head>
<body>
    <main>
        <h1>"Proyecto Ingenieria Web - Ing. en Ciencias de la computacion"</h1>
        <h2>"Hola mundo mi nombre es Jhordy Camacas!!"</h2>
    </main>
</body>
</html>
